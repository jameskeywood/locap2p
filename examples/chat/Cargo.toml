[package]
name = "chat-example"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
libp2p = { version = "0.57", features = [ "tokio", "gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "quic"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
