[package]
name = "locap2p-network"
version = "0.1.0"
edition = "2024"

[dependencies]
locap2p-core = { workspace = true }

futures = { workspace = true }
libp2p = { workspace = true, features = [
    "cbor",
    "macros",
    "mdns",
    "noise",
    "quic",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
